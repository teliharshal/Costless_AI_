services:

  backend:
    build:
      context: ./server

    ports:
      - "8080:8080"


    depends_on:
      - postgres

  postgres:
    image: postgres:16

    env_file:
      - server/.env

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}